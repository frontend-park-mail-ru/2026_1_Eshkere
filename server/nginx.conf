server{
listen 80;
server_name eshkereklama.ru;

  return 301 https://$host$request_uri;

}

server {
listen 443 ssl http2;
server_name eshkereklama.ru;

  root /home/ubuntu/frontend/dist;
  index index.html;

  ssl_certificate /etc/letsencrypt/live/eshkereklama.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/eshkereklama.ru/privkey.pem;
  
  location = /api/webhook/yookassa {
    proxy_pass http://127.0.0.1:8000/api/webhook/yookassa;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /api/ {
	client_max_body_size 20m;
	  proxy_pass http://127.0.0.1:8000;
	  proxy_http_version 1.1;
	  proxy_set_header Host $host;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_set_header X-Forwarded-Proto https;
  }

   location /feed/ {
    proxy_pass http://127.0.0.1:8000;   # без trailing slash
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
  
  location /public/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
	
   location /ad/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /click/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /s3/ {
	  proxy_pass http://127.0.0.1:9000/;
	  proxy_http_version 1.1;
	  proxy_set_header Host 127.0.0.1;
	  proxy_set_header X-Real-IP $remote_addr;
	  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	  proxy_buffering off;
  }

  location / {
	  try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  location = /manifest.json {
	  add_header Cache-Control "public";
  }

  location = /sw.js {
	  add_header Cache-Control "no-cache";
  }

}
